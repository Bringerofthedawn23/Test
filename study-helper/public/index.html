<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Helper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 640px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* The three big choice buttons */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 4px;
    }
    .choice {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 16px 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, background .2s;
    }
    .choice:hover { border-color: var(--accent); }
    .choice .icon { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    @media (max-width: 420px) {
      .choices { grid-template-columns: 1fr; }
    }

    /* Grade level + detail controls */
    .options { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .option-group { flex: 1; min-width: 150px; }
    .option-group label {
      display: block; font-size: .78rem; color: var(--muted);
      margin-bottom: 6px; font-weight: 600;
    }
    select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      font-size: .95rem;
      font-family: inherit;
    }
    select:focus { outline: none; border-color: var(--accent); }

    textarea {
      width: 100%;
      min-height: 110px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      margin-top: 14px;
      display: none;
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    input[type="file"] { display: none; }
    img#preview {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 14px;
      display: none;
    }
    button.solve {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 16px;
      transition: background .2s;
    }
    button.solve:hover:not(:disabled) { background: var(--accent-hover); }
    button.solve:disabled { opacity: .5; cursor: not-allowed; }

    #result { white-space: pre-wrap; line-height: 1.6; font-size: 1rem; }
    #result.empty { color: var(--muted); }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📚 Study Helper</h1>
    <p class="sub">Get a step-by-step explanation of any homework problem.</p>

    <div class="card">
      <div class="choices">
        <button class="choice" id="btnType">
          <span class="icon">⌨️</span>Type it
        </button>
        <button class="choice" id="btnCamera">
          <span class="icon">📷</span>Take photo
        </button>
        <button class="choice" id="btnGallery">
          <span class="icon">🖼️</span>From gallery
        </button>
      </div>

      <!-- Typing box (hidden until "Type it" is chosen) -->
      <textarea id="questionText" placeholder="Type your question here, e.g. Solve for x: 2x + 5 = 13"></textarea>

      <!-- Two hidden file inputs: one forces the camera, one opens the gallery -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" />
      <input type="file" id="galleryInput" accept="image/*" />

      <img id="preview" alt="Your homework" />

      <div class="options">
        <div class="option-group">
          <label for="gradeLevel">School level</label>
          <select id="gradeLevel">
            <option value="primary">Primary (ages 6–11)</option>
            <option value="middle" selected>Middle (ages 12–14)</option>
            <option value="high">High school (ages 15–18)</option>
          </select>
        </div>
        <div class="option-group">
          <label for="detail">Explanation</label>
          <select id="detail">
            <option value="simple" selected>Simple &amp; short</option>
            <option value="detailed">More detail</option>
          </select>
        </div>
      </div>

      <button class="solve" id="solveBtn" disabled>Explain it to me</button>
    </div>

    <div class="card">
      <div id="result" class="empty">Your explanation will appear here.</div>
    </div>

    <footer>Powered by Claude</footer>
  </div>

  <script>
    const btnType = document.getElementById("btnType");
    const btnCamera = document.getElementById("btnCamera");
    const btnGallery = document.getElementById("btnGallery");
    const questionText = document.getElementById("questionText");
    const cameraInput = document.getElementById("cameraInput");
    const galleryInput = document.getElementById("galleryInput");
    const preview = document.getElementById("preview");
    const solveBtn = document.getElementById("solveBtn");
    const result = document.getElementById("result");

    let imageBase64 = null;
    let mediaType = null;

    // Enable the "Explain" button when there's either text or an image.
    function refreshButton() {
      const hasText = questionText.value.trim().length > 0;
      const hasImage = imageBase64 !== null;
      solveBtn.disabled = !(hasText || hasImage);
    }

    // Clear any previously chosen image (used when switching to typing).
    function clearImage() {
      imageBase64 = null;
      mediaType = null;
      preview.style.display = "none";
      preview.src = "";
    }

    // --- Choice buttons ---
    btnType.addEventListener("click", () => {
      clearImage();
      questionText.style.display = "block";
      questionText.focus();
      refreshButton();
    });

    btnCamera.addEventListener("click", () => {
      cameraInput.click(); // opens the phone camera
    });

    btnGallery.addEventListener("click", () => {
      galleryInput.click(); // opens the photo gallery / file picker
    });

    questionText.addEventListener("input", refreshButton);

    // --- Handle a chosen image (from either camera or gallery) ---
    function handleFile(file) {
      if (!file) return;
      questionText.style.display = "none"; // hide typing box when using a photo
      questionText.value = "";
      mediaType = file.type;
      const reader = new FileReader();
      reader.onload = () => {
        imageBase64 = reader.result.split(",")[1];
        preview.src = reader.result;
        preview.style.display = "block";
        refreshButton();
      };
      reader.readAsDataURL(file);
    }

    cameraInput.addEventListener("change", () => handleFile(cameraInput.files[0]));
    galleryInput.addEventListener("change", () => handleFile(galleryInput.files[0]));

    // --- Send to the server ---
    solveBtn.addEventListener("click", async () => {
      solveBtn.disabled = true;
      solveBtn.innerHTML = '<span class="spinner"></span>Thinking...';
      result.classList.remove("empty");
      result.textContent = "";

      try {
        const res = await fetch("/api/solve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageBase64,
            mediaType,
            questionText: questionText.value,
            gradeLevel: document.getElementById("gradeLevel").value,
            detail: document.getElementById("detail").value,
          }),
        });
        const data = await res.json();
        result.textContent = data.error ? "⚠️ " + data.error : data.answer;
      } catch (err) {
        result.textContent = "⚠️ Could not reach the server. Please try again.";
      } finally {
        solveBtn.disabled = false;
        solveBtn.textContent = "Explain it to me";
        refreshButton();
      }
    });
  </script>
</body>
</html>
