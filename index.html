<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert between 160+ world currencies with live exchange rates." />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://open.er-api.com" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Currency Converter</h1>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle__icon">🌙</span>
      </button>
    </header>

    <section class="card" aria-labelledby="convertHeading">
      <h2 id="convertHeading" class="visually-hidden">Convert an amount</h2>

      <div class="field">
        <label class="field__label" for="amount">Amount</label>
        <input
          id="amount"
          class="field__input field__input--amount"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          value="1"
          aria-describedby="result"
        />
      </div>

      <div class="converter">
        <div class="field field--currency">
          <label class="field__label" for="fromCurrency">From</label>
          <select id="fromCurrency" class="field__input field__select"></select>
        </div>

        <button id="swapBtn" class="swap-btn" type="button" aria-label="Swap currencies" title="Swap currencies">
          <span aria-hidden="true">⇅</span>
        </button>

        <div class="field field--currency">
          <label class="field__label" for="toCurrency">To</label>
          <select id="toCurrency" class="field__input field__select"></select>
        </div>
      </div>

      <div id="result" class="result" role="status" aria-live="polite">
        <div class="result__main">
          <span id="resultValue" class="result__value">—</span>
        </div>
        <div id="resultRate" class="result__rate"></div>
      </div>
    </section>

    <footer class="app__footer">
      <span id="status" class="status">Loading exchange rates…</span>
      <button id="refreshBtn" class="link-btn" type="button">Refresh</button>
    </footer>
  </main>

  <script src="currencies.js"></script>
  <script src="app.js"></script>
</body>
</html>
